<app-modal [isOpen]="isOpen" (close)="onCancel()">
  <div class="p-6">
    <div class="mb-5 text-center">
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-error-100 dark:bg-error-500/20">
        <svg
          class="h-6 w-6 text-error-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          ></path>
        </svg>
      </div>
      <h3 class="mb-2 text-xl font-bold text-gray-800 dark:text-white">
        {{ title }}
      </h3>
      <p class="text-gray-500 dark:text-gray-400">
        {{ message }}
      </p>
    </div>

    <div class="flex items-center justify-center gap-3">
      <button
        type="button"
        class="flex justify-center rounded-lg border border-gray-300 bg-white px-6 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-400 dark:hover:border-gray-500 dark:hover:bg-gray-700 dark:focus:ring-gray-700"
        (click)="onCancel()"
      >
        {{ cancelText }}
      </button>
      <button
        type="button"
        class="flex justify-center rounded-lg bg-error-600 px-6 py-2 text-sm font-medium text-white hover:bg-error-700 focus:outline-none focus:ring-2 focus:ring-error-500/50"
        (click)="onConfirm()"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</app-modal>

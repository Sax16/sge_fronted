<div class="relative w-full rounded-xl border p-4" [ngClass]="variantClasses.container">
  @if (showCloseButton) {
  <button
    (click)="alertClose.emit()"
    class="absolute right-2 top-2 flex h-8 w-8 items-center justify-center rounded-full text-gray-400 transition-colors hover:bg-black/5 hover:text-gray-700 dark:text-gray-500 dark:hover:bg-white/10 dark:hover:text-white"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M6.04289 16.5413C5.65237 16.9318 5.65237 17.565 6.04289 17.9555C6.43342 18.346 7.06658 18.346 7.45711 17.9555L11.9987 13.4139L16.5408 17.956C16.9313 18.3466 17.5645 18.3466 17.955 17.956C18.3455 17.5655 18.3455 16.9323 17.955 16.5418L13.4129 11.9997L17.955 7.4576C18.3455 7.06707 18.3455 6.43391 17.955 6.04338C17.5645 5.65286 16.9313 5.65286 16.5408 6.04338L11.9987 10.5855L7.45711 6.0439C7.06658 5.65338 6.43342 5.65338 6.04289 6.0439C5.65237 6.43442 5.65237 7.06759 6.04289 7.45811L10.5845 11.9997L6.04289 16.5413Z"
        fill="currentColor"
      />
    </svg>
  </button>
  }
  <div class="flex items-start gap-3">
    <div class="-mt-0.5 shrink-0" [ngClass]="variantClasses.icon" [innerHTML]="iconSvg | safeHtml"></div>

    <div [ngClass]="{'pr-6': showCloseButton}">
      <h4 class="mb-1 text-sm font-semibold text-gray-800 dark:text-white/90">
        {{ title }}
      </h4>
      

      <p class="text-sm text-gray-500 dark:text-gray-400">{{ message }}</p>

      @if (showLink) {
      <a
        [routerLink]="linkHref"
        class="inline-block mt-3 text-sm font-medium text-gray-500 underline dark:text-gray-400"
      >
        {{ linkText }}
      </a>
      }
    </div>
  </div>
</div>

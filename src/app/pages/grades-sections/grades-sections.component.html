<div>
  <app-page-breadcrumb [pageTitle]="'Grados y Secciones'" />

  @if (alertService.alert(); as alert) {
    <div class="mb-4">
      <app-alert
        [variant]="alert.variant"
        [title]="alert.title"
        [message]="alert.message"
        [showLink]="false"
        [showCloseButton]="true"
        (alertClose)="alertService.clearAlert()"
      />
    </div>
  }

  <!-- Tab selector -->
  <div class="mb-5">
    <app-tab [options]="tabOptions" [(selectedValue)]="selectedAcademicType" />
  </div>

  <!-- Content -->
  @if (isLoading()) {
    <div class="flex items-center justify-center py-16">
      <div class="flex flex-col items-center gap-3">
        <svg
          class="animate-spin text-brand-500"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M12 3a9 9 0 1 0 9 9" />
        </svg>
        <span class="text-sm text-gray-500 dark:text-gray-400">Cargando niveles...</span>
      </div>
    </div>
  } @else {
    <app-level-list
      [levels]="filteredLevels()"
      [grades]="grades()"
      [sections]="sections()"
      [type]="$any(selectedAcademicType())"
      (dataChanged)="loadData()"
    />
  }
</div>

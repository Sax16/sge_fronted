<div
  class="rounded-xl border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-900 overflow-hidden"
>
  <!-- Header: nivel name + badge + toggle -->
  <button
    type="button"
    (click)="toggleOpen()"
    class="flex w-full items-center justify-between px-5 py-4 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors"
  >
    <div class="flex items-center gap-3">
      <!-- Cap icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="text-brand-500 dark:text-brand-400 shrink-0"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M22 9l-10 -4l-10 4l10 4l10 -4v6" />
        <path d="M6 10.6v5.4a6 3 0 0 0 12 0v-5.4" />
      </svg>
      <span class="text-base font-semibold text-gray-800 dark:text-white">
        {{ level().name }}
      </span>
      <!-- Grades count badge -->
      <span
        class="inline-flex items-center rounded-full bg-gray-900 px-2.5 py-0.5 text-xs font-medium text-white dark:bg-gray-700"
      >
        {{ gradesForLevel().length }}
        {{ gradesForLevel().length === 1 ? 'grado' : 'grados' }}
      </span>
    </div>

    <!-- Chevron -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="text-gray-500 transition-transform duration-200 dark:text-gray-400"
      [class.rotate-180]="isOpen()"
    >
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M6 9l6 6l6 -6" />
    </svg>
  </button>

  <!-- Grades list (collapsible) -->
  @if (isOpen()) {
    <div class="divide-y divide-gray-100 border-t border-gray-200 dark:divide-gray-700 dark:border-gray-700">
      @for (grade of gradesForLevel(); track grade.id) {
        <div class="flex items-center justify-between px-5 py-3.5">
          <div class="flex items-center gap-2.5">
            <!-- Book open icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-gray-400 dark:text-gray-500"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
              <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
              <path d="M3 6l0 13" />
              <path d="M12 6l0 13" />
              <path d="M21 6l0 13" />
            </svg>
            <span class="text-sm text-gray-700 dark:text-gray-300">
              {{ grade.name }}
            </span>
          </div>
          <button
            type="button"
            class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 active:scale-95 transition-all dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M12 5l0 14" />
              <path d="M5 12l14 0" />
            </svg>
            Agregar Sección
          </button>
        </div>
      } @empty {
        <p class="px-5 py-4 text-sm text-gray-500 dark:text-gray-400">
          Sin grados registrados.
        </p>
      }
    </div>
  }
</div>

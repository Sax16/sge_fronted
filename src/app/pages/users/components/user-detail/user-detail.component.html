@if (user) {
  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
    <div class="flex gap-5 flex-row items-center justify-between mb-5 lg:mb-6">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-item-icon-active"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
        <h4 class="text-lg font-semibold text-center text-gray-800 dark:text-white/90 xl:text-left">
          {{ user.userName }}
        </h4>
      </div>
      <app-button (click)="handleEditClick(user.id)" size="sm" variant="outline" startIcon='<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" /><path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" /><path d="M16 5l3 3" /></svg>'>
        Editar
      </app-button>
    </div>
    <div class="space-y-6">
      <div>
        <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
          <div class="px-6 py-5">
            <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">
              Información de Usuario
            </h4>
          </div>
          <div class="p-4 border-t border-gray-100 dark:border-gray-800 sm:p-6">
            <div class="grid grid-cols-2 gap-4 lg:grid-cols-3 lg:gap-7 2xl:gap-x-32">
              <div>
                <p class="mb-2 text-base leading-normal text-gray-500 dark:text-gray-400">
                  Nombre de Usuario
                </p>
                <p class="text-base font-medium text-gray-800 dark:text-white/90">
                  {{ user.userName }}
                </p>
              </div>
              <div>
                <p class="mb-2 text-base leading-normal text-gray-500 dark:text-gray-400">
                  Rol
                </p>
                <p class="text-base font-medium text-gray-800 dark:text-white/90">
                  {{ user.role }}
                </p>
              </div>
              <div>
                <p class="mb-2 text-base leading-normal text-gray-500 dark:text-gray-400">
                  Empleado ID
                </p>
                <p class="text-base font-medium text-gray-800 dark:text-white/90">
                  #{{ user.employeeId }}
                </p>
              </div>
              <div>
                <p class="mb-2 text-base leading-normal text-gray-500 dark:text-gray-400">
                  Estado
                </p>
                <app-badge
                  variant="light"
                  [color]="getBadgeColor(user.isActive)"
                  size="md"
                >
                  {{ getStatusLabel(user.isActive) }}
                </app-badge>
              </div>
              <div>
                <p class="mb-2 text-base leading-normal text-gray-500 dark:text-gray-400">
                  Fecha de Registro
                </p>
                <p class="text-base font-medium text-gray-800 dark:text-white/90">
                  {{ user.createdAt | date:'longDate' }}
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
}

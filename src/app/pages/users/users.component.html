<div>
  <app-page-breadcrumb [pageTitle]="'Gestión de Usuarios'" />

  @if (alertService.alert(); as alert) {
    <div class="mb-4">
      <app-alert
        [variant]="alert.variant"
        [title]="alert.title"
        [message]="alert.message"
        [showLink]="false"
        [showCloseButton]="true"
        (alertClose)="alertService.clearAlert()"
      />
    </div>
  }

  @if (state.isLoading()) {
    <div class="flex items-center justify-center p-8">
      <div class="text-gray-500 dark:text-gray-400">Cargando...</div>
    </div>
  }

  <!-- List View -->
  @if (isListView()) {
    <app-user-table
      [users]="state.users()"
      [employees]="state.employees()"
      (newUser)="navigateToCreate()"
      (editUser)="navigateToEdit($event)"
      (deleteUser)="state.openDeleteConfirmModal($event)"
      (viewUser)="navigateToView($event)"
    />
  }

  <!-- Create View -->
  @if (isCreateView()) {
      <app-user-form 
        [employees]="state.employees()"
        (submitForm)="state.createUser($any($event))"
        (cancelForm)="navigateToList()"
      />
  }

  <!-- Edit View -->
  @if (isEditView()) {
    @if (state.selectedUser(); as user) {
      <app-user-form 
        [user]="user"
        [isEditMode]="true"
        [employees]="state.employees()"
        (submitForm)="handleUserUpdate($any($event))"
        (cancelForm)="navigateToList()"
      />
    }
  }

  <!-- Detail View -->
  @if (isDetailView()) {
    @if (state.selectedUser(); as user) {
      <app-user-detail 
        [user]="user"
        [employees]="state.employees()"
        (editUser)="navigateToEdit($event)"
      />
    }
  }

  <!-- Confirm Delete Modal -->
  <app-confirm-modal
    [isOpen]="state.isConfirmModalOpen()"
    title="Eliminar usuario"
    message="¿Está seguro de que desea eliminar este usuario? Esta acción no se puede deshacer."
    confirmText="Eliminar"
    cancelText="Cancelar"
    (confirm)="state.deleteUser()"
    (cancel)="state.closeConfirmModal()"
  />
</div>

<div>
  <app-page-breadcrumb [pageTitle]="'Gestión de Empleados'" />

  @if (alertService.alert(); as alert) {
    <div class="mb-4">
      <app-alert
        [variant]="alert.variant"
        [title]="alert.title"
        [message]="alert.message"
        [showLink]="false"
        [showCloseButton]="true"
        (alertClose)="alertService.clearAlert()"
      />
    </div>
  }

  @if (state.isLoading()) {
    <div class="flex items-center justify-center p-8">
      <div class="text-gray-500 dark:text-gray-400">Cargando...</div>
    </div>
  }

  <!-- List View -->
  @if (isListView()) {
    <app-employee-table
      [employees]="state.employees()"
      (newEmployee)="navigateToCreate()"
      (editEmployee)="navigateToEdit($event)"
      (deleteEmployee)="state.openDeleteConfirmModal($event)"
      (viewEmployee)="navigateToView($event)"
    />
  }

  <!-- Create View -->
  @if (isCreateView()) {
      <app-employee-form 
        (submitForm)="state.createEmployee($any($event))"
        (cancelForm)="navigateToList()"
      />
  }

  <!-- Edit View -->
  @if (isEditView()) {
    @if (state.selectedEmployee(); as employee) {
      <app-employee-form 
        [employee]="employee"
        [isEditMode]="true"
        (submitForm)="handleEmployeeUpdate($any($event))"
        (cancelForm)="navigateToList()"
      />
    }
  }

  <!-- Detail View -->
  @if (isDetailView()) {
    @if (state.selectedEmployee(); as employee) {
      <app-employee-detail 
        [employee]="employee"
        (editEmployee)="navigateToEdit($event)"
      />
    }
  }

  <!-- Confirm Delete Modal -->
  <app-confirm-modal
    [isOpen]="state.isConfirmModalOpen()"
    title="Eliminar empleado"
    message="¿Está seguro de que desea eliminar este empleado? Esta acción no se puede deshacer."
    confirmText="Eliminar"
    cancelText="Cancelar"
    (confirm)="state.deleteEmployee()"
    (cancel)="state.closeConfirmModal()"
  />
</div>

<div>
  <app-page-breadcrumb />

  @if (errorMessage) {
    <div class="mb-4 rounded-lg bg-red-50 p-4 text-red-800 dark:bg-red-900/20 dark:text-red-400">
      {{ errorMessage }}
    </div>
  }

  @if (isLoading) {
    <div class="flex items-center justify-center p-8">
      <div class="text-gray-500 dark:text-gray-400">Cargando...</div>
    </div>
  }

  <!-- List View -->
  @if (isListView()) {
    <app-employee-table
      [employees]="employees"
      (newEmployee)="handleNewEmployeeClick()"
      (editEmployee)="handleEditEmployeeClick($event)"
      (deleteEmployee)="handleEmployeeDelete($event)"
    />
  }

  <!-- Create View -->
  @if (isCreateView()) {
    <div class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-white/[0.05] dark:bg-white/[0.03]">
      <app-employee-form 
        (submitForm)="handleEmployeeCreate($any($event))"
        (cancelForm)="handleFormCancel()"
      />
    </div>
  }

  <!-- Edit View -->
  @if (isEditView() && selectedEmployee) {
    <div class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-white/[0.05] dark:bg-white/[0.03]">
      <app-employee-form 
        [employee]="selectedEmployee"
        [isEditMode]="true"
        (submitForm)="handleEmployeeUpdate($any($event))"
        (cancelForm)="handleFormCancel()"
      />
    </div>
  }
</div>
